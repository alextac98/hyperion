appId: app.hyperion.desktop
productName: Hyperion
asar: true
extraResources:
  - from: build/icon.png
    to: hyperion-icon.png

publish:
  provider: github
  owner: alextac98
  repo: hyperion

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!node_modules/**/*"

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # The release build script overrides these defaults when credentials are absent.
  notarize: true
  target:
    - dmg
    - zip
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"

dmg:
  artifactName: "${productName}-mac-${arch}.${ext}"

win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: "${productName}-windows-${arch}.${ext}"

linux:
  category: Office
  icon: build/icon.png
  target:
    - AppImage
  artifactName: "${productName}-linux-${arch}.${ext}"

npmRebuild: false
