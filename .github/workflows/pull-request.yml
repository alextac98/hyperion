name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:desktop

  integration:
    name: Desktop integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: pnpm
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pnpm install --frozen-lockfile
      - name: Run desktop integration suite
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm test:integration
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-integration-failures
          path: /tmp/hyperion-*failure*.png
          if-no-files-found: ignore
