name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate committed release version
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: version
        uses: actions/github-script@v8
        with:
          script: |
            const { assertReleaseAvailable } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-version.mjs`);
            const { version } = require('./package.json');
            const tag = await assertReleaseAvailable(github, context.repo, version);
            core.setOutput('tag', tag);
            await core.summary.addHeading(`Release ${tag}`)
              .addRaw(`Commit: ${context.sha}. Later changes to main are not included.`)
              .write();

  quality:
    name: Release quality checks
    timeout-minutes: 20
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:desktop

  build:
    name: Build ${{ matrix.name }}
    environment: release
    timeout-minutes: 40
    needs: [prepare, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            arch: arm64
            artifact: desktop-macos-arm64
          - name: Windows x64
            os: windows-2022
            arch: x64
            artifact: desktop-windows-x64
          - name: Linux x64
            os: ubuntu-24.04
            arch: x64
            artifact: desktop-linux-x64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            arch: arm64
            artifact: desktop-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build:web && pnpm build:electron && node scripts/build-release.mjs ${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.MACOS_CERTIFICATE || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - name: Collect release files
        shell: bash
        run: |
          mkdir release-publish
          find release -maxdepth 1 -type f \( \
            -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o \
            -name '*.AppImage' -o -name '*.yml' -o -name '*.blockmap' \
          \) -exec cp {} release-publish/ \;
          test -n "$(find release-publish -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-publish/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    timeout-minutes: 15
    needs: [prepare, quality, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck version before publication
        uses: actions/github-script@v8
        with:
          script: |
            const { assertReleaseAvailable } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-version.mjs`);
            await assertReleaseAvailable(github, context.repo, require('./package.json').version);
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-publish
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-publish
        run: find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt
      - name: Include checksums
        run: mv SHA256SUMS.txt release-publish/
      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG_NAME" release-publish/* --target "$RELEASE_SHA" --title "$TAG_NAME" --generate-notes --draft
          gh release edit "$TAG_NAME" --draft=false --latest
